name: ios

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install swiftlint swiftformat
      - run: swiftformat --lint .
      - run: swiftlint --strict

  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # IOS-005 : tests des modules (Swift Testing), rapides, sans simulateur.
      - run: swift test --package-path Packages
      # Tests sur simulateur (Keychain), signature ad hoc sans équipe : construit aussi l'app complète.
      - run: brew install xcodegen && xcodegen generate
      - run: scripts/test-simulator.sh
