# Projet Xcode généré par XcodeGen (`xcodegen generate`) : le .xcodeproj n'est pas versionné,
# ce qui évite les conflits de merge (IOS-003). Le code vit dans le package local Packages/ (IOS-002).
name: iOSApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
packages:
  Packages:
    path: Packages
targets:
  iOSApp:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Packages
        product: AuthFeature
      - package: Packages
        product: NotesFeature
      - package: Packages
        product: CoreAuth
      - package: Packages
        product: CoreModels
      - package: Packages
        product: DesignSystem
      - package: Packages
        product: CoreNetworking
    # Les tests du package local sont aussi lancés par `xcodebuild test` sur simulateur (IOS-005).
    scheme:
      testTargets:
        # Tests hébergés par l'app : le Keychain demande un trousseau d'app (IOS-004).
        - iOSAppTests
        # Parcours critique de connexion, avec les doublures de l'app (IOS-005).
        - iOSAppUITests
        - package: Packages/AuthFeatureTests
        - package: Packages/CoreAuthTests
        - package: Packages/CoreNetworkingTests
        - package: Packages/DesignSystemTests
        - package: Packages/NotesFeatureTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          # Simulateur → API locale (boilerplate api-nestjs) et front web local (web-react-vite).
          API_BASE_URL: http://localhost:3000
          # Liens des e-mails (vérification, nouveau mot de passe) : doit figurer dans CORS_ORIGINS de l'API.
          WEB_BASE_URL: http://localhost:5173
          # IOS-004 : seule exception ATS, en Debug uniquement (réseau local).
          INFOPLIST_FILE: App/Info-Debug.plist
        Release:
          API_BASE_URL: https://api.example.com
          WEB_BASE_URL: https://app.example.com
  iOSAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: iOSApp
      - package: Packages
        product: CoreAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app.tests
        GENERATE_INFOPLIST_FILE: YES
  iOSAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: iOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app.uitests
        GENERATE_INFOPLIST_FILE: YES
