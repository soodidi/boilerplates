# Hooks Git (GLB-002, GLB-005, FE-002). Installés automatiquement par `npm install` (script prepare).
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,tsx,json,css,md,yml,yaml,html}'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts,tsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    secrets:
      # GLB-005 : https://github.com/gitleaks/gitleaks#installing (brew install gitleaks)
      run: gitleaks git --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test
