name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_DEFAULT_REGION: fr-par
      S3_ENDPOINT: https://s3.fr-par.scw.cloud
      # AWS CLI 2.23+ calcule par défaut des sommes de contrôle que les S3 compatibles refusent.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: ${{ vars.BUCKET }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # OPS-004 : la configuration propre à l'environnement est injectée au déploiement.
      - name: Écrire config.json
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          API_URL: ${{ vars.API_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg apiUrl "$API_URL" \
            --arg sentryDsn "$SENTRY_DSN" \
            '{environment: $environment, apiUrl: $apiUrl, sentryDsn: $sentryDsn, enableMocks: false}' \
            > dist/config.json

      # Fichiers avec hash : cache long et immuable. index.html et config.json : jamais en cache.
      - name: Publier sur Object Storage
        run: |
          aws s3 sync dist "s3://$BUCKET" --endpoint-url "$S3_ENDPOINT" --delete \
            --exclude index.html --exclude config.json \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --endpoint-url "$S3_ENDPOINT" \
            --cache-control "no-cache"
          aws s3 cp dist/config.json "s3://$BUCKET/config.json" --endpoint-url "$S3_ENDPOINT" \
            --cache-control "no-cache"
