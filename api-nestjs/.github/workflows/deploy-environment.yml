name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      IMAGE: ${{ inputs.image }}
    steps:
      # OPS-004 / BE-003 : les migrations s'appliquent au démarrage des nouvelles instances, sous
      # verrou, avant /health/ready. Une migration qui échoue garde l'ancienne version en service.
      - name: Installer la CLI Scaleway (version épinglée, OPS-002)
        env:
          SCW_CLI_VERSION: 2.65.2
          SCW_CLI_SHA256: 184e697e6ab8a8e825be1c5cf61d104341abe3598bb0e20b7a54618cb05231b3
        run: |
          curl -fsSL -o scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          echo "${SCW_CLI_SHA256}  scw" | sha256sum --check
          sudo install scw /usr/local/bin/scw
      - name: Déployer
        env:
          CONTAINER_ID: ${{ vars.CONTAINER_ID }}
        run: |
          scw container container update "$CONTAINER_ID" image="$IMAGE"
          # Prêt seulement quand le conteneur sert la NOUVELLE image (sondes /health/ready, BE-007),
          # pour ne pas confondre avec l'ancienne version encore en ligne.
          for _ in $(seq 1 60); do
            sleep 10
            info=$(scw container container get "$CONTAINER_ID" -o json)
            status=$(echo "$info" | jq -r .status)
            image=$(echo "$info" | jq -r .image)
            echo "status: $status, image: $image"
            [ "$status" = "error" ] && echo "::error::$(echo "$info" | jq -r .error_message)" && exit 1
            [ "$status" = "ready" ] && [ "$image" = "$IMAGE" ] && exit 0
          done
          echo "::error::Le conteneur n'est pas prêt après 10 minutes" && exit 1
