name: deploy

# OPS-004 : une image par commit sur main (taguée avec le SHA), déployée en staging, puis en
# production. Pour un repo privé, GitHub ne propose pas de validation obligatoire (reviewers) hors
# Enterprise : à régler avant le premier déploiement réel (décision en attente,
# engineering-guidelines/docs/suivi/HANDOFF.md).
#
# À configurer dans GitHub :
#   repo : variable REGISTRY_IMAGE (ex. rg.fr-par.scw.cloud/mon-projet/api). Aucun secret au niveau du repo :
#     n'importe quelle branche poussée pourrait le lire (OPS-006) ; l'image est poussée depuis l'environnement staging
#   environnements staging / production :
#     secrets : SCW_ACCESS_KEY, SCW_SECRET_KEY (clé deploy-api de envs/iam). Pas de DATABASE_URL :
#     les migrations s'appliquent au démarrage de l'API, dans le réseau privé (BE-003)
#     variables : SCW_DEFAULT_PROJECT_ID, CONTAINER_ID (ID du Serverless Container créé par infra-scaleway)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    # OPS-006 : déploiement depuis `main` seulement, même lancé à la main (les environnements
    # `staging` et `production` sont aussi limités à `main` dans GitHub).
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker.yml
    with:
      push: true
    secrets: inherit

  staging:
    needs: image
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
    secrets: inherit

  production:
    needs: [image, staging]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
