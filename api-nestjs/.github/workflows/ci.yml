name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Format, lint, types, architecture, tests unitaires + intégration (Docker dispo sur le runner), build.
      - run: npm run verify
      # BE-004 : contrat OpenAPI publié à chaque build, pour générer les clients web et mobile.
      - run: npm run openapi
        env:
          DATABASE_URL: postgres://unused:unused@localhost:5432/unused
          SMTP_URL: smtp://localhost:1025
          MAIL_FROM: unused@localhost
          BETTER_AUTH_SECRET: unused-secret-for-openapi-export-only
          BETTER_AUTH_URL: http://localhost:3000
          WEB_URL: http://localhost:5173
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: openapi.json

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # BE-003 : le schéma TypeScript et les migrations commitées sont cohérents.
      - run: npx drizzle-kit check
      - name: Aucune migration manquante
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle || (echo "::error::Lancer npm run db:generate et commiter drizzle/" && exit 1)

  image:
    uses: ./.github/workflows/docker.yml
    with:
      push: false

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            revert
            adr
