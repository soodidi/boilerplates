# Dépendances locales (OPS-001). Mêmes versions majeures qu'en production (OPS-005).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 3s
      retries: 10

  # BE-009 : capture tous les e-mails envoyés en local. Boîte de réception sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
