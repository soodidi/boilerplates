name: infra

# OPS-003 : vérifications sans secret sur chaque PR ; après fusion, plan affiché dans le résumé du
# job puis `apply` (staging). Production et shared : seulement par un lancement manuel depuis `main`
# (onglet Actions), qui affiche le plan puis l'applique. Pour un repo privé, GitHub ne propose pas de
# validation obligatoire (reviewers) hors Enterprise : le lancement manuel en tient lieu.
#
# OPS-006 : une PR exécute la version du workflow de sa branche, et n'importe quel plan lit le state
# `iam` (toutes les clés) avec une passphrase commune : aucune PR n'a donc accès à un secret. Les
# environnements `staging`, `production` et `production-plan` sont limités à la branche `main`
# (« Deployment branches » dans GitHub) : c'est cette règle, pas le workflow, qui protège les secrets.
#
# À configurer dans GitHub (créés et limités à `main` par /new-project ; GitHub Pro requis pour un repo privé) :
#   environnements `staging` et `production` pour l'apply (reviewers sur production si le repo est public),
#   et `production-plan` (clé API en lecture seule) pour le plan affiché avant l'apply :
#     secrets : SCW_ACCESS_KEY, SCW_SECRET_KEY (sorties de envs/iam), TF_STATE_PASSPHRASE
#     variables : SCW_DEFAULT_PROJECT_ID, SCW_DEFAULT_ORGANIZATION_ID
#   les tfvars de chaque environnement sont versionnés dans envs/<env>/<env>.auto.tfvars
#   (aucun secret dedans).

on:
  pull_request:
    paths: ['envs/**', 'modules/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['envs/**', 'modules/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement à appliquer
        type: choice
        # shared (registre, domaine d'envoi) : commun aux environnements, appliqué à la demande,
        # avec les secrets de l'environnement production.
        options: [staging, production, shared]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
      - run: tofu fmt -check -recursive
      - name: tofu validate
        run: |
          # envs/iam est appliqué à la main avec une clé admin (OPS-006) : validé ici, jamais appliqué.
          for env in envs/*/; do
            tofu -chdir="$env" init -backend=false -input=false
            tofu -chdir="$env" validate
          done
      - name: tflint
        run: |
          # Version et empreinte épinglées (OPS-002).
          curl -fsSL -o tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.65.0/tflint_linux_amd64.zip
          echo "d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61  tflint.zip" | sha256sum --check
          unzip -q tflint.zip -d "$RUNNER_TEMP" && rm tflint.zip
          export PATH="$RUNNER_TEMP:$PATH"
          tflint --init
          tflint --recursive
      # OPS-006 : rien qui sorte un secret d'un plan (affiché dans le résumé du job) ou l'envoie au
      # dehors pendant le plan. Filet de sécurité pour le code fusionné : une PR peut modifier ce
      # workflow, la vraie barrière est la limitation des environnements à `main`.
      - name: secrets hors des plans
        run: |
          if grep -rnE 'nonsensitive\(|data "(external|http)"|provisioner "|local-exec' envs modules; then
            echo "::error::Construction interdite : elle peut révéler un secret dans un plan (OPS-006)."
            exit 1
          fi
      # Mauvaises configurations de sécurité (bucket public non voulu, chiffrement…).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # Plan de production ou de shared, affiché avant l'apply (et avant la validation si le repo en a une).
  plan-protected:
    if: github.event_name == 'workflow_dispatch' && inputs.environment != 'staging' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-plan
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - run: tofu -chdir="envs/$ENVIRONMENT" init -input=false
      - name: tofu plan
        run: |
          tofu -chdir="envs/$ENVIRONMENT" plan -input=false -no-color -lock=false > plan.txt
          {
            echo "### Plan $ENVIRONMENT (à relire avant de valider l'apply)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    # Seulement depuis `main` ; production et shared après leur plan, staging directement.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.checks.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.plan-protected.result == 'success' ||
       (needs.plan-protected.result == 'skipped' && (inputs.environment || 'staging') == 'staging'))
    needs: [checks, plan-protected]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment == 'shared' && 'production' || inputs.environment || 'staging' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      # OPS-006 : passphrase de chiffrement du state, nécessaire dès `tofu init`.
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - run: tofu -chdir="envs/$ENVIRONMENT" init -input=false
      # Le plan appliqué est celui affiché ici.
      - name: tofu plan
        run: |
          tofu -chdir="envs/$ENVIRONMENT" plan -input=false -no-color -out=tfplan > plan.txt
          {
            echo "### Plan $ENVIRONMENT (appliqué)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: tofu -chdir="envs/$ENVIRONMENT" apply -input=false tfplan
